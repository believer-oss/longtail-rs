name: "Differential (vs the C implementation)"

# Regression against the retained C implementation via longtail-sys: proves the
# pure-Rust port still produces byte-identical output to the library it replaced.
#
# WHY THESE TRIGGERS. This lane used to run on a weekly cron, which encoded two
# premises that are both false: that upstream is a moving target (the C library
# has not changed significantly in over a year, and both it and golongtail are
# pinned), and that this repo churns (it does not — it is a finished port going
# into maintenance). A weekly run mostly proved upstream still equals itself.
#
# What the lane is actually for is surviving *maintenance*: a Rust dependency
# bump is the realistic way byte-compatibility breaks from here, because the
# codecs and hashes we produce bytes with are third-party crates (lz4_flex,
# brotli, zstd, blake3, blake2). So it runs whenever the dependency graph moves —
# which means every Renovate PR proves interop before it merges — plus on
# demand before a switchover. The monthly cron is a liveness canary for the lane
# itself (submodule fetch, prebuilt download, C toolchain), not a drift check.
on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/differential.yaml"
      - "support/longtail-sys/**"
      - "support/longtail-ffi/**"
      - "support/longtail-testkit/**"
  push:
    branches:
      - "main"
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Monthly liveness canary — the 1st at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Runs the whole workspace plus the self-validation suite that proves the C
  # library reproduces every committed golden, and the codec/chunker/hash
  # differentials.
  #
  # The `differential` feature also compiles a small C shim
  # (support/longtail-testkit/shim/hpcdc_discriminator_shim.c) via `cc` in
  # longtail-testkit's build.rs, so this lane requires a **host C compiler**
  # (present on the GitHub ubuntu/windows runners); the golden `d` table +
  # boundary-table equality fallback covers environments without a C compiler.
  differential-linux:
    name: differential lane - linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.sh

      # Fetch the pinned golongtail binary so the three-way e2e
      # differential runs its spawned third way (Rust vs ffi vs golongtail). The
      # test skips this third way cleanly if the fetch is unavailable.
      - run: cargo run -p xtask -- fetch-golongtail

      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

      # The legacy C crates are excluded from the per-PR clippy gate (CI-02), so
      # they are linted here — the one lane that already pays for the native
      # build.
      - name: Clippy (including the legacy C crates)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Differential-lane bench-crate compile-check. The `differential`
      # feature pulls longtail-ffi (cannot compile in the pure lane) and builds
      # the e2e + ffi-driver bins. Never RUN in CI.
      - run: cargo bench --no-run -p longtail-bench --features differential

  differential-windows:
    name: differential lane - windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.ps1

      # No `fetch-golongtail` here: xtask's channel is Linux-only by
      # construction (`xtask/src/main.rs:38-41` pins `longtail-linux-x64` for the
      # URL, filename and sha256), so the three-way e2e self-skips its third way
      # on Windows. Review finding CI-13.
      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

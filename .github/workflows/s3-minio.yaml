name: "S3 integration"

# The S3-backed blob/sync tests and the mixed-writer test (concurrent Rust +
# golongtail writers against one store). These need a live S3-compatible
# endpoint, so they are not part of the per-PR suite.
#
# Triggered by dependency changes rather than by a clock: S3 is the production
# store and both implementations write it concurrently, and the realistic way
# that breaks is a dependency bump — `aws-sdk-s3` and the stack under it move
# often. The monthly cron is a liveness check on this workflow itself.
#
# LONGTAIL_TEST_S3_REQUIRED makes these unable to pass by *not running*: they
# skip cleanly when LONGTAIL_TEST_S3_ENDPOINT is absent, so they stay inert
# elsewhere, but here a missing endpoint is a failure rather than a silent
# green.
on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/s3-minio.yaml"
      - "crates/longtail-store/src/blob/**"
      - "crates/longtail-store/src/sync.rs"
  push:
    branches:
      - "main"
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:
  schedule:
    # Monthly liveness canary — the 1st at 05:00 UTC.
    - cron: "0 5 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  s3-minio-linux:
    name: s3 - linux
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # minio is started as a step, not a service container: the official image
    # needs `server /data` as its command and `services:` cannot supply one.
    # (bitnami/minio started a server by default and auto-created
    # MINIO_DEFAULT_BUCKETS, but no longer publishes the tag this used.)
    env:
      LONGTAIL_TEST_S3_ENDPOINT: http://localhost:9000
      LONGTAIL_TEST_S3_BUCKET: longtail-test
      LONGTAIL_TEST_S3_ACCESS_KEY: minioadmin
      LONGTAIL_TEST_S3_SECRET_KEY: minioadmin
      LONGTAIL_TEST_S3_REQUIRED: "1"

    steps:
      # First, so it boots while the toolchain installs.
      - name: Start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - name: Wait for minio and create the bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready; then break; fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/ready \
            || { echo "::error::minio did not become ready"; docker logs minio; exit 1; }
          # The tests set force_path_style, so a plain host works here.
          aws --endpoint-url http://localhost:9000 s3 mb s3://longtail-test

      # The S3 blob/sync tests live in longtail-store's `s3_spec` integration
      # test; the env vars above make them execute against minio (they skip when
      # absent). The mem/fs store suite already runs in the main test job.
      - name: S3 blob/sync tests against minio
        run: cargo test -p longtail-store --test s3_spec

  # Interop gate ⑧: Rust CLI + spawned golongtail concurrently upsync
  # disjoint content to one minio store, then cross-downsync. golongtail's AWS
  # SDK uses VIRTUAL-HOST addressing (it never sets UsePathStyle), so minio must
  # run with MINIO_DOMAIN and the endpoint host must resolve `<bucket>.<host>`.
  # `*.127.0.0.1.nip.io` resolves to 127.0.0.1 via public DNS, so it works on a
  # runner. Validated locally against podman minio.
  s3-interop-gate8:
    name: s3 mixed-writer interop - linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LONGTAIL_TEST_S3_ENDPOINT: http://127.0.0.1.nip.io:9000
      LONGTAIL_TEST_S3_BUCKET: longtail-interop
      LONGTAIL_TEST_S3_ACCESS_KEY: minioadmin
      LONGTAIL_TEST_S3_SECRET_KEY: minioadmin
      LONGTAIL_TEST_S3_REQUIRED: "1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    steps:
      # MINIO_DOMAIN makes minio serve `<bucket>.<host>`, which golongtail's SDK
      # requires; see the note above.
      - name: Start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_DOMAIN=127.0.0.1.nip.io \
            minio/minio:latest server /data

      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1
      - name: Wait for minio and create the bucket
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/ready \
            || { echo "::error::minio did not become ready"; docker logs minio; exit 1; }
          # Created through the virtual-host endpoint, so this also proves the
          # `<bucket>.<host>` path works before the interop test depends on it.
          aws --endpoint-url http://127.0.0.1.nip.io:9000 s3 mb s3://longtail-interop
      - name: Fetch pinned golongtail
        run: cargo run -p xtask -- fetch-golongtail
      - name: Gate 8 mixed-writer interop
        run: cargo test -p longtail-cli --test s3_interop -- --nocapture

name: "Test Suite"
on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pure lane: no native lib, no network beyond the toolchain. Builds and tests
  # the default members and checks the committed fixtures against manifest.json.
  pure-linux:
    name: pure lane - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: cargo build
      - run: cargo test
      - run: cargo run -p xtask -- verify-fixtures

  pure-windows:
    name: pure lane - windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: cargo build
      - run: cargo test
      - run: cargo run -p xtask -- verify-fixtures

  # Differential lane: pulls the prebuilt native lib via longtail-sys. Runs the
  # whole workspace plus the Stage 1 self-validation suite that proves the C
  # library reproduces every committed golden, and the Stage 3 codec/chunker/hash
  # differentials.
  #
  # NOTE (Stage 3): the `differential` feature now also compiles a small C shim
  # (support/longtail-testkit/shim/hpcdc_discriminator_shim.c) via `cc` in
  # longtail-testkit's build.rs, so this lane now requires a **host C compiler**
  # (present on the GitHub ubuntu/windows runners). Stage 1 designed this lane as
  # "prebuilt lib, no C toolchain"; the Task 6 fallback (golden `d` table +
  # boundary-table equality) covers environments without a C compiler.
  differential-linux:
    name: differential lane - linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.sh

      # Fetch the pinned golongtail binary so the Stage-5 three-way e2e
      # differential runs its spawned third way (Rust vs ffi vs golongtail). The
      # test skips this third way cleanly if the fetch is unavailable.
      - run: cargo run -p xtask -- fetch-golongtail

      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

  differential-windows:
    name: differential lane - windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.ps1

      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

  # Nightly clippy + rustfmt. Pin clippy to the nightly toolchain explicitly so
  # CI matches local `cargo +nightly clippy` (the setup action installs nightly
  # but does not necessarily make it the default toolchain for bare `cargo`).
  formatting:
    name: cargo clippy and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo +nightly clippy --workspace --all-targets

      # Also lint the pure `fastcdc` chunker feature (no native lib needed). The
      # `differential`-feature clippy runs in the differential lane / locally, as
      # it needs the prebuilt lib + a C compiler.
      - name: Clippy (fastcdc feature)
        run: cargo +nightly clippy --workspace --all-targets --features longtail-core/fastcdc

  # Miri: catch undefined behaviour across the trust-critical pure logic of
  # `longtail-core`. Covers the format layer's unaligned byte-cursor reads (packed
  # `u64` arrays can land on 4-byte boundaries) AND, since Stage 3, the algorithm
  # layer — the chunker, the payload framing codec, the codec/hash registries, the
  # pure codecs (lz4_flex, brotli), and the hash layer (blake2 is pure Rust;
  # blake3 has portable `cfg(miri)` fallbacks). The zstd codec is FFI (libzstd) —
  # outside miri's reach — so its tests are `cfg`-excluded under miri and the
  # zstd differential runs in the differential lane instead. Runs per-PR:
  # `longtail-core` is small, needs no native lib, and case counts are capped
  # under `cfg!(miri)`, so gating merges on it is cheap insurance.
  miri:
    name: miri (longtail-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Miri test longtail-core
        run: cargo +nightly miri test -p longtail-core

name: "Test Suite"
on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pure lane: no native lib, no network beyond the toolchain. Builds and tests
  # the default members and checks the committed fixtures against manifest.json.
  pure-linux:
    name: pure lane - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: cargo build
      - run: cargo test
      - run: cargo run -p xtask -- verify-fixtures

  pure-windows:
    name: pure lane - windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: cargo build
      - run: cargo test
      - run: cargo run -p xtask -- verify-fixtures

  # Differential lane: pulls the prebuilt native lib via longtail-sys (no C
  # toolchain needed). Runs the whole workspace plus the Stage 1 self-validation
  # suite that proves the C library reproduces every committed golden.
  differential-linux:
    name: differential lane - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.sh

      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

  differential-windows:
    name: differential lane - windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1

      - run: |
          pushd test-data
          ./mkdata.ps1

      - run: cargo test --workspace
      - run: cargo test -p longtail-testkit --features differential

  # Nightly clippy + rustfmt. Pin clippy to the nightly toolchain explicitly so
  # CI matches local `cargo +nightly clippy` (the setup action installs nightly
  # but does not necessarily make it the default toolchain for bare `cargo`).
  formatting:
    name: cargo clippy and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: believer-oss/setup-rust-toolchain@ff4c7a2d9523e22eab355f13c7732a4ea3e7a9b1
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo +nightly clippy --workspace --all-targets

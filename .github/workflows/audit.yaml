name: "Audit Dependencies"
on:
  # Gate pull requests, not just pushes, so a dependency added in a PR is
  # audited before it merges.
  pull_request:
    paths:
      - ".github/workflows/audit.yaml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/audit.toml"
      - "deny.toml"
  # `main` only. Without the branch filter this also fires on every branch push,
  # so a pull request was audited twice on the same commit — once for the push,
  # once for the pull_request event.
  push:
    branches:
      - "main"
    paths:
      # Run if workflow changes
      - ".github/workflows/audit.yaml"
      # Run on changed dependencies
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      # Run if the configuration file changes
      - "**/audit.toml"
      - "deny.toml"
  # Rerun periodicly to pick up new advisories
  schedule:
    - cron: "0 0 * * *"
  # Run manually
  workflow_dispatch:

# A new push supersedes the run in flight; the advisory database is a moving
# target, so only the result for the current commit is worth anything. Keyed by
# ref so the scheduled run on `main` cannot cancel a pull request's.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit - linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # `issues: write` for the scheduled-run issue reports; `checks: write` so
      # the action can create its check-run on push events (without it the API
      # call fails with "Resource not accessible by integration").
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@3ae01282e2311f82d96cc2181b31c4fbe3dd00c0
        name: audit - linux
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        # Comma separated list of issues to ignore
        # ignore: RUSTSEC-2020-0036

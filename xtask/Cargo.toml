[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[dependencies]
longtail-testkit = { path = "../support/longtail-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
anyhow = "1"
tempfile = "3"

[features]
# Enables boundary-table generation via the C chunker (needed by gen-fixtures).
# Kept off by default so `verify-fixtures`/`fetch-golongtail` need no
# native lib.
differential = ["longtail-testkit/differential"]

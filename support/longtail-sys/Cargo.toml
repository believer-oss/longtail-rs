[package]
name = "longtail-sys"
version = "0.1.0"
edition = "2021"
links = "longtail"
description = "LEGACY. Raw bindgen bindings to the prebuilt longtail C library. Retained solely for differential regression testing of the pure-Rust workspace against the C implementation; not a default workspace member. Scheduled for deletion after one release cycle of the pure-Rust code in production."

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "rustls-tls-webpki-roots",
] }
bindgen = "0.72"
cc = "1.2"
sha2 = "0.10.9"
zip = "4.3"

[dependencies]

[features]
default = ["vendored"]
vendored = []

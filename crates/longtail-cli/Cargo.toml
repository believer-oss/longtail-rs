[package]
name = "longtail-cli"
version.workspace = true
edition.workspace = true

[[bin]]
# Deliberately not `longtail`: golongtail installs under that name and both
# tools will be on the same machines for a long time.
name = "longtail-rs"
path = "src/main.rs"

[features]
default = ["s3"]
s3 = ["longtail/s3"]

[dependencies]
longtail = { path = "../longtail", default-features = false }
longtail-core = { path = "../longtail-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "signal"] }
serde_json = "1"
indicatif = "0.18"
bytesize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
longtail-testkit = { path = "../../support/longtail-testkit" }
tempfile = "3"
libc = "0.2"

[package]
name = "longtail-store"
version.workspace = true
edition.workspace = true

[features]
default = ["s3"]
# The S3 blob backend (aws-sdk-s3). On by default; the mem/fs backends and the
# whole sync/actor stack build without it.
s3 = [
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "dep:aws-credential-types",
  "dep:aws-smithy-runtime-api",
  "dep:aws-types",
]

[dependencies]
longtail-core = { path = "../longtail-core" }
tokio = { version = "1.49", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
] }
async-trait = "0.1"
futures-util = "0.3"
fs4 = { version = "0.13.1", features = ["sync"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
num_cpus = "1.17"
# CPU bridge for the CompressBlockStore decorator: compress/decompress runs on a
# caller-supplied rayon pool via `pool.spawn` + a tokio oneshot — never
# `spawn_blocking` for CPU work.
rayon = "1"

# S3 backend (feature `s3`, default on)
aws-config = { version = "1.8", features = ["behavior-version-latest"], optional = true }
# `default-features = false` drops aws-sdk-s3's default `rustls` feature — the
# legacy hyper-0.14 + rustls 0.21 connector (aws-smithy-runtime `tls-rustls`),
# which drags in the unmaintained rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/
# 0104) with no fixed 0.101.x. We only use the modern `default-https-client`
# (rustls 0.23 + aws-lc) path; the legacy connector is redundant.
aws-sdk-s3 = { version = "1.120", optional = true, default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
aws-credential-types = { version = "1.2", optional = true }
aws-smithy-runtime-api = { version = "1.10", optional = true }
aws-types = { version = "1.3", optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["full", "test-util"] }
tempfile = "3"
rand = "0.9"
rand_chacha = "0.9"
sha2 = "0.10"
# Credential-refresh proof: inject a fake HTTP layer + custom credentials
# provider without touching the network.
aws-smithy-http-client = { version = "1.1", features = ["test-util"] }
aws-smithy-types = "1.3"
aws-smithy-runtime-api = "1.10"
aws-credential-types = { version = "1.2", features = ["test-util"] }
aws-sdk-s3 = { version = "1.120", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
http = "1"

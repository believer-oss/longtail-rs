[package]
name = "longtail"
version.workspace = true
edition.workspace = true

[features]
default = ["s3"]
# Pass the S3 backend through to longtail-store (on by default).
s3 = ["longtail-store/s3"]

[dependencies]
longtail-core = { path = "../longtail-core" }
longtail-store = { path = "../longtail-store", default-features = false }
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7"
# Owned byte buffers for the blob write path (`write_to_uri` hands `Bytes`
# straight to the S3 body with no copy — matters for the ~GB version-local
# `.lsi` and prune store-index writes).
bytes = "1"
rayon = "1"
regex = "1"
thiserror = "2"
tracing = "0.1"
num_cpus = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
longtail-testkit = { path = "../../support/longtail-testkit" }
tempfile = "3"
tokio = { version = "1.49", features = ["full", "test-util"] }
libc = "0.2"
# Capture-and-assert on the library's own events: an operation that falls back
# to a slow path must say so, and that is only testable with a subscriber.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
